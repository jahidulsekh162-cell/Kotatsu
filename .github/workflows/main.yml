name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built APK (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          **/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Decode keystore and write signing properties
      if: secrets.ANDROID_KEYSTORE_BASE64 != ''
      run: |
        echo "Decoding keystore..."
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<EOF
KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks
KEYSTORE_PASSWORD=${{ Milon }}
KEY_ALIAS=${{ milon }}
KEY_PASSWORD=${{ milon81 }}
EOF

    - name: Show Gradle info
      run: ./gradlew -version

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kotatsu-release
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release (optional)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
